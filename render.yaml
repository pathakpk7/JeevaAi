services:
  - type: web
    name: jeevaai-medebot
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RETRIEVAL_TOP_K
        value: "4"
      - key: RETRIEVAL_MIN_SCORE
        value: "0.0"
      - key: GENERATION_MAX_CONTEXT_CHUNKS
        value: "4"
